[package]
name = "squelch"
version = "0.1.0"
description = "Lightweight cross-platform menu bar internet radio player"
authors = ["mrbvrz"]
license = "MIT"
repository = "https://github.com/mrbvrz/squelch"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "squelch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon", "image-ico", "image-png", "macos-private-api", "devtools"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
window-vibrancy = "0.5"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["stream"] }
bytes = "1"
futures-util = "0.3"
axum = "0.8"
tokio-stream = { version = "0.1", features = ["sync"] }
