name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release macOS Bundle
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri Application
        run: npm run tauri:build

      - name: Package macOS DMG & ZIP
        run: |
          VERSION=$(node -p "require('./package.json').version")
          BUNDLE_DIR="src-tauri/target/release/bundle/macos"
          DMG_DIR="src-tauri/target/release/bundle/dmg"
          DMG_NAME="Squelch-${VERSION}-arm64.dmg"
          ZIP_NAME="Squelch-${VERSION}-arm64.zip"

          echo "Packaging DMG via scripts/build-dmg.sh..."
          bash scripts/build-dmg.sh

          echo "Packaging ZIP..."
          cd "$BUNDLE_DIR"
          zip -r -9 "${ZIP_NAME}" Squelch.app
          cd -

          echo "Generating SHA256 checksums..."
          shasum -a 256 "${DMG_DIR}/${DMG_NAME}" "${BUNDLE_DIR}/${ZIP_NAME}" > "${BUNDLE_DIR}/SHA256SUMS.txt"

          echo "DMG_PATH=${DMG_DIR}/${DMG_NAME}" >> $GITHUB_ENV
          echo "ZIP_PATH=${BUNDLE_DIR}/${ZIP_NAME}" >> $GITHUB_ENV
          echo "CHECKSUM_PATH=${BUNDLE_DIR}/SHA256SUMS.txt" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Squelch v${{ env.VERSION }}
          tag_name: ${{ startsWith(github.ref_name, 'v') && github.ref_name || format('v{0}', env.VERSION) }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ env.DMG_PATH }}
            ${{ env.ZIP_PATH }}
            ${{ env.CHECKSUM_PATH }}
