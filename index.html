<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self' 'unsafe-inline' 'unsafe-eval'; media-src * http://127.0.0.1:* blob: data:; connect-src * http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:* ipc: tauri:; img-src * data: https: http: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval' ipc: tauri:;"
        />
        <title>Squelch</title>
        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background-color: #1e1e20;
                color: #f5f5f7;
                font-family:
                    -apple-system, BlinkMacSystemFont, 'SF Pro Text',
                    'Helvetica Neue', sans-serif;
            }
            @media (prefers-color-scheme: light) {
                html,
                body {
                    background-color: #f2f2f7;
                    color: #1d1d1f;
                }
                .skel-sidebar {
                    background-color: rgba(232, 232, 237, 0.95) !important;
                    border-right-color: rgba(0, 0, 0, 0.12) !important;
                }
                .skel-block {
                    background-color: rgba(0, 0, 0, 0.06) !important;
                }
            }
        </style>
    </head>
    <body class="antialiased selection:bg-[#0A84FF] selection:text-white">
        <div id="root">
            <div
                style="
                    display: flex;
                    height: 100vh;
                    width: 100vw;
                    overflow: hidden;
                    -webkit-user-select: none;
                    user-select: none;
                "
            >
                <div
                    class="skel-sidebar"
                    style="
                        width: 240px;
                        height: 100%;
                        background-color: rgba(38, 38, 40, 0.92);
                        border-right: 1px solid rgba(255, 255, 255, 0.08);
                        padding: 46px 14px 14px;
                        box-sizing: border-box;
                        display: flex;
                        flex-direction: column;
                        gap: 12px;
                    "
                >
                    <div
                        class="skel-block"
                        style="
                            height: 28px;
                            border-radius: 8px;
                            background: rgba(255, 255, 255, 0.06);
                        "
                    ></div>
                    <div
                        class="skel-block"
                        style="
                            height: 14px;
                            width: 55%;
                            border-radius: 4px;
                            background: rgba(255, 255, 255, 0.05);
                            margin-top: 8px;
                        "
                    ></div>
                    <div
                        class="skel-block"
                        style="
                            height: 14px;
                            width: 75%;
                            border-radius: 4px;
                            background: rgba(255, 255, 255, 0.05);
                        "
                    ></div>
                    <div
                        class="skel-block"
                        style="
                            height: 14px;
                            width: 65%;
                            border-radius: 4px;
                            background: rgba(255, 255, 255, 0.05);
                        "
                    ></div>
                    <div
                        class="skel-block"
                        style="
                            height: 14px;
                            width: 70%;
                            border-radius: 4px;
                            background: rgba(255, 255, 255, 0.05);
                        "
                    ></div>
                </div>
                <div
                    style="
                        flex: 1;
                        height: 100%;
                        padding: 20px 28px;
                        box-sizing: border-box;
                        display: flex;
                        flex-direction: column;
                        gap: 16px;
                    "
                >
                    <div
                        class="skel-block"
                        style="
                            height: 28px;
                            width: 160px;
                            border-radius: 6px;
                            background: rgba(255, 255, 255, 0.08);
                        "
                    ></div>
                    <div
                        class="skel-block"
                        style="
                            height: 44px;
                            border-radius: 10px;
                            background: rgba(255, 255, 255, 0.05);
                        "
                    ></div>
                    <div
                        class="skel-block"
                        style="
                            height: 54px;
                            border-radius: 10px;
                            background: rgba(255, 255, 255, 0.04);
                        "
                    ></div>
                    <div
                        class="skel-block"
                        style="
                            height: 54px;
                            border-radius: 10px;
                            background: rgba(255, 255, 255, 0.04);
                        "
                    ></div>
                    <div
                        class="skel-block"
                        style="
                            height: 54px;
                            border-radius: 10px;
                            background: rgba(255, 255, 255, 0.04);
                        "
                    ></div>
                </div>
            </div>
        </div>
        <script type="module" src="/src/app/main.tsx"></script>
    </body>
</html>
